<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Internal Support Ticket System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ══════════════════════════════════════════════════════════════════
       Neo-brutalist ticketing UI.
       Palette and vocabulary borrowed from the Block Frame deck: off-white
       paper, 4px black borders, hard offset shadows, zero radius.
       One addition — a red — because the deck has no alarm colour and
       "urgent" needs one.
       ══════════════════════════════════════════════════════════════════ */
    :root {
      --paper:  #FFFDF5;
      --ink:    #000000;
      --white:  #FFFFFF;
      --pink:   #FE90E8;
      --blue:   #C0F7FE;
      --green:  #99E885;
      --yellow: #F7CB46;
      --cream:  #FFDC8B;
      --red:    #FF5A5A;
      --grey:   #6B6B63;

      --bd:     4px solid var(--ink);
      --bd-3:   3px solid var(--ink);
      --bd-2:   2px solid var(--ink);
      --sh:     8px 8px 0 var(--ink);
      --sh-sm:  4px 4px 0 var(--ink);

      /* status */
      --open: var(--yellow);
      --in_progress: var(--blue);
      --resolved: var(--green);
      /* priority — a separate range so the two axes never collide */
      --low: var(--white);
      --medium: var(--cream);
      --high: var(--pink);
      --urgent: var(--red);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--paper);
      color: var(--ink);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
    }

    /* ── shared vocabulary ─────────────────────────────────────────── */
    .lbl {
      font-family: 'Space Grotesk', monospace;
      font-size: 10.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.09em;
    }
    .mono { font-family: 'Space Grotesk', monospace; }

    .block {
      display: inline-block;
      border: var(--bd-2);
      padding: 3px 9px;
      font-family: 'Space Grotesk', monospace;
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      background: var(--white);
      white-space: nowrap;
    }
    .block.open { background: var(--open); }
    .block.in_progress { background: var(--in_progress); }
    .block.resolved { background: var(--resolved); }
    .block.low { background: var(--low); }
    .block.medium { background: var(--medium); }
    .block.high { background: var(--high); }
    .block.urgent { background: var(--urgent); }

    /* ── buttons: press into their own shadow ──────────────────────── */
    button, .btn {
      font-family: 'Inter', sans-serif;
      font-weight: 800;
      font-size: 12.5px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border: var(--bd-3);
      background: var(--white);
      color: var(--ink);
      padding: 8px 16px;
      cursor: pointer;
      box-shadow: var(--sh-sm);
      transition: none;
    }
    button:hover { background: var(--cream); }
    button:active { transform: translate(4px, 4px); box-shadow: none; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button:disabled:active { transform: none; box-shadow: var(--sh-sm); }
    button.primary { background: var(--yellow); }
    button.primary:hover { background: var(--pink); }
    button.danger { background: var(--red); }
    button.danger:hover { background: var(--ink); color: var(--paper); }
    button.ghost { background: var(--white); }

    /* ── header ────────────────────────────────────────────────────── */
    header {
      border-bottom: var(--bd);
      background: var(--white);
      padding: 14px 22px;
      display: flex;
      align-items: center;
      gap: 20px;
      flex: none;
    }
    header h1 {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: -0.035em;
      text-transform: uppercase;
      white-space: nowrap;
      line-height: 1;
    }
    /* The emoji carries no side bearing, and the h1's negative tracking pulls
       the next letter into it — so the gap has to be explicit, not a space. */
    header h1 .mark { margin-right: 9px; letter-spacing: 0; }
    .stats { display: flex; align-items: center; gap: 8px; flex: 1; overflow-x: auto; scrollbar-width: none; }
    .stats::-webkit-scrollbar { display: none; }
    .stat {
      flex: 0 0 auto;
      border: var(--bd-2);
      background: var(--white);
      box-shadow: 3px 3px 0 var(--ink);
      padding: 3px 10px;
      display: flex;
      align-items: baseline;
      gap: 6px;
      white-space: nowrap;
    }
    .stat .n {
      font-family: 'Space Grotesk', monospace;
      font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums;
    }
    .stat .l {
      font-family: 'Space Grotesk', monospace;
      font-size: 9.5px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.07em;
    }
    /* Prefixed so a stat key can never collide with a layout class —
       `messages` previously matched .messages { flex: 1 } in the detail pane. */
    .stat.s-total { background: var(--white); }
    .stat.s-open { background: var(--yellow); }
    .stat.s-in_progress { background: var(--blue); }
    .stat.s-resolved { background: var(--green); }
    .stat.s-urgent { background: var(--red); }
    .stat.s-messages { background: var(--cream); }
    .stat.s-archived { background: var(--paper); }
    header .user {
      font-family: 'Space Grotesk', monospace;
      font-size: 11px; color: var(--grey); white-space: nowrap;
    }

    /* ── filter bar ────────────────────────────────────────────────── */
    .filterbar {
      border-bottom: var(--bd);
      background: var(--paper);
      padding: 12px 22px;
      display: flex;
      align-items: center;
      gap: 18px;
      flex: none;
      flex-wrap: wrap;
    }
    .search {
      border: var(--bd-3);
      background: var(--white);
      box-shadow: var(--sh-sm);
      padding: 8px 12px;
      width: 250px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 500;
    }
    .search::placeholder { color: var(--grey); }
    .search:focus { outline: none; background: var(--blue); }
    .fgroup { display: flex; align-items: center; gap: 8px; }
    .fgroup > .lbl { color: var(--grey); }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip {
      font-family: 'Space Grotesk', monospace;
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      border: var(--bd-2);
      background: var(--white);
      box-shadow: none;
      padding: 4px 10px;
    }
    .chip:hover { background: var(--cream); }
    .chip:active { transform: translate(2px, 2px); }
    .chip.on {
      background: var(--chipc, var(--ink));
      box-shadow: 3px 3px 0 var(--ink);
    }
    .chip.on.dark { background: var(--ink); color: var(--paper); }

    /* Divider + archive toggle. Deliberately styled unlike .chip: a heavier
       border and its own shadow mark it as a different axis (live vs archived),
       not another value of Status. margin-left:auto parks it at the far end. */
    .fdiv {
      width: 0; align-self: stretch;
      border-left: var(--bd-2);
      margin-left: auto;
    }
    .archive-toggle {
      font-family: 'Space Grotesk', monospace;
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      border: var(--bd-3);
      background: var(--white);
      box-shadow: var(--sh-sm);
      padding: 6px 12px;
    }
    .archive-toggle:hover { background: var(--cream); }
    .archive-toggle[aria-pressed="true"] {
      background: var(--ink);
      color: var(--paper);
    }

    /* ── main split ────────────────────────────────────────────────── */
    main { display: grid; grid-template-columns: 400px 1fr; flex: 1; min-height: 0; }

    .list-pane {
      border-right: var(--bd);
      background: var(--paper);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .list-head {
      padding: 10px 16px;
      border-bottom: var(--bd-3);
      display: flex; align-items: center; justify-content: space-between;
      background: var(--white);
      flex: none;
    }
    .list-head .lbl { font-size: 11px; font-weight: 700; }
    .list-head .count { font-family: 'Space Grotesk', monospace; font-size: 11px; color: var(--grey); }
    .ticket-list { overflow-y: auto; flex: 1; padding: 14px; display: flex; flex-direction: column; gap: 12px; }

    .ticket-item {
      border: var(--bd-3);
      background: var(--white);
      box-shadow: var(--sh-sm);
      padding: 13px 15px;
      cursor: pointer;
    }
    .ticket-item:hover { background: var(--cream); }
    .ticket-item.selected {
      background: var(--blue);
      box-shadow: var(--sh);
      transform: translate(-2px, -2px);
    }
    .ticket-item.archived { background: repeating-linear-gradient(45deg, var(--white), var(--white) 7px, var(--paper) 7px, var(--paper) 14px); }
    .ticket-item .title {
      font-weight: 700; font-size: 14.5px; line-height: 1.3; margin-bottom: 9px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .ticket-item .meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .ticket-item .when {
      font-family: 'Space Grotesk', monospace; font-size: 10px;
      color: var(--grey); margin-left: auto; white-space: nowrap;
    }

    /* ── detail ────────────────────────────────────────────────────── */
    .detail-pane { display: flex; flex-direction: column; overflow: hidden; background: var(--paper); }
    .detail-head { padding: 18px 22px; border-bottom: var(--bd); background: var(--white); flex: none; }
    .detail-head .top { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 12px; }
    .detail-head h2 {
      font-size: 24px; font-weight: 900; letter-spacing: -0.03em;
      line-height: 1.12; flex: 1;
    }
    .detail-meta {
      display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
      font-family: 'Space Grotesk', monospace; font-size: 11px; color: var(--grey);
    }
    .detail-meta strong { color: var(--ink); font-weight: 600; }
    .controls { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin-top: 13px; }
    .ctl { display: flex; align-items: center; gap: 8px; }
    .ctl > .lbl { color: var(--grey); }
    select.hard {
      font-family: 'Space Grotesk', monospace;
      font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
      border: var(--bd-3); background: var(--white); box-shadow: var(--sh-sm);
      padding: 6px 10px; cursor: pointer; color: var(--ink);
    }
    select.hard:focus { outline: none; background: var(--blue); }
    /* segmented priority control — four blocks, active one filled */
    .seg { display: flex; box-shadow: var(--sh-sm); }
    .seg button {
      box-shadow: none; border: var(--bd-2); border-right-width: 0;
      padding: 6px 11px; font-size: 10.5px; font-family: 'Space Grotesk', monospace;
      font-weight: 700; letter-spacing: 0.06em; background: var(--white);
    }
    .seg button:last-child { border-right-width: 2px; }
    .seg button:active { transform: none; }
    .seg button.on { background: var(--segc); }
    .seg button.on::after { content: ""; }

    .archived-banner {
      margin-top: 13px; border: var(--bd-3); background: var(--cream);
      box-shadow: var(--sh-sm); padding: 9px 14px;
      font-family: 'Space Grotesk', monospace; font-size: 11.5px; font-weight: 600;
    }

    .messages { flex: 1; overflow-y: auto; padding: 20px 22px; display: flex; flex-direction: column; gap: 12px; }
    .message { border: var(--bd-3); background: var(--white); box-shadow: var(--sh-sm); padding: 13px 16px; }
    .message .head {
      display: flex; justify-content: space-between; gap: 14px; margin-bottom: 7px;
      font-family: 'Space Grotesk', monospace; font-size: 10.5px; color: var(--grey);
    }
    .message .author { font-weight: 700; color: var(--ink); text-transform: uppercase; letter-spacing: 0.05em; }
    .message .body { white-space: pre-wrap; word-break: break-word; font-size: 14px; font-weight: 500; }

    .compose { padding: 14px 22px; border-top: var(--bd); background: var(--white); display: flex; gap: 12px; align-items: stretch; flex: none; }
    .compose textarea {
      flex: 1; border: var(--bd-3); background: var(--paper); box-shadow: var(--sh-sm);
      padding: 10px 13px; font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 500;
      resize: none; min-height: 56px;
    }
    .compose textarea:focus { outline: none; background: var(--white); }

    .empty {
      display: flex; flex-direction: column; gap: 10px;
      align-items: center; justify-content: center; height: 100%; padding: 40px; text-align: center;
    }
    .empty .big { font-size: 40px; }
    .empty .msg {
      font-family: 'Space Grotesk', monospace; font-size: 12px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.07em; color: var(--grey);
    }

    /* ── dialogs ───────────────────────────────────────────────────── */
    dialog {
      /* `margin: auto` is what centers a showModal() dialog — the * reset
         above wipes the UA default, so it has to be restored explicitly. */
      margin: auto;
      border: var(--bd); background: var(--white); box-shadow: 12px 12px 0 var(--ink);
      padding: 0; width: 92%; max-width: 470px; color: var(--ink);
    }
    dialog::backdrop { background: rgba(0,0,0,0.45); }
    dialog form, dialog .content { padding: 24px; }
    dialog h3 { font-size: 22px; font-weight: 900; letter-spacing: -0.03em; text-transform: uppercase; margin-bottom: 6px; }
    dialog .sub { font-size: 13.5px; font-weight: 500; margin-bottom: 20px; line-height: 1.45; }
    .field { margin-bottom: 16px; }
    .field > .lbl { display: block; margin-bottom: 6px; color: var(--grey); }
    .field input, .field select {
      width: 100%; border: var(--bd-3); background: var(--paper); box-shadow: var(--sh-sm);
      padding: 10px 12px; font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600; color: var(--ink);
    }
    .field select { text-transform: uppercase; font-family: 'Space Grotesk', monospace; font-size: 12.5px; letter-spacing: 0.05em; }
    .field input:focus, .field select:focus { outline: none; background: var(--white); }
    .field input.bad { background: var(--red); }
    .hint { font-family: 'Space Grotesk', monospace; font-size: 10.5px; margin-top: 6px; min-height: 14px; color: var(--grey); }
    .hint.err { color: var(--ink); background: var(--red); display: inline-block; padding: 2px 7px; border: var(--bd-2); font-weight: 700; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    dialog .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 6px; }

    /* ── toast: hard shatter ───────────────────────────────────────── */
    .toast-layer { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; z-index: 100; }
    .toast {
      border: var(--bd); background: var(--toastc, var(--white)); box-shadow: 10px 10px 0 var(--ink);
      padding: 20px 34px; font-size: 21px; font-weight: 900;
      text-transform: uppercase; letter-spacing: -0.01em; opacity: 0;
    }
    .toast.enter { animation: slam 0.14s steps(3, end) forwards; }
    @keyframes slam {
      from { opacity: 1; transform: scale(1.35) rotate(-3deg); }
      to   { opacity: 1; transform: scale(1) rotate(-1deg); }
    }
    .toast .char { display: inline-block; white-space: pre; }
    /* steps() makes the letters jump away in discrete frames — digital
       shatter rather than smoke. No blur: blur is not in this vocabulary. */
    .toast.leave { background: transparent; border-color: transparent; box-shadow: none; }
    .toast.leave .char { animation: shatter 0.42s steps(4, end) forwards; animation-delay: var(--d); }
    @keyframes shatter {
      from { opacity: 1; transform: translate(0,0) rotate(0); }
      to   { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--r)); }
    }
    @media (prefers-reduced-motion: reduce) {
      .toast.enter { animation-duration: 0.01s; }
      .toast.leave .char { animation: none; opacity: 0; }
      button:active { transform: none; }
    }

    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
      .list-pane { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <h1><span class="mark" aria-hidden="true">🎫</span>Internal Support Ticket System</h1>
    <div class="stats" id="stats"></div>
    <span class="user" id="user-email"></span>
    <button class="primary" id="new-ticket-btn">+ New Ticket</button>
  </header>

  <div class="filterbar">
    <input class="search" id="search" type="search" placeholder="Search titles…" />
    <div class="fgroup">
      <span class="lbl">Status</span>
      <div class="chips" id="status-filters"></div>
    </div>
    <div class="fgroup">
      <span class="lbl">Priority</span>
      <div class="chips" id="priority-filters"></div>
    </div>
    <!-- Archive is not a status — it is the soft-delete flag (tickets.deleted_at).
         It sits past a divider so it never reads as a fourth status chip. -->
    <div class="fdiv"></div>
    <button class="archive-toggle" id="archive-toggle"
            aria-pressed="false" title="Show archived (soft-deleted) tickets">
      <span aria-hidden="true">📦</span> Archived
    </button>
  </div>

  <main>
    <section class="list-pane">
      <div class="list-head">
        <span class="lbl" id="list-heading">All Tickets</span>
        <span class="count" id="list-count"></span>
      </div>
      <div class="ticket-list" id="ticket-list">
        <div class="empty"><span class="msg">Loading…</span></div>
      </div>
    </section>

    <section class="detail-pane" id="detail-pane">
      <div class="empty">
        <span class="big">🎫</span>
        <span class="msg">Select a ticket to open its thread</span>
      </div>
    </section>
  </main>

  <dialog id="new-ticket-dialog">
    <form id="new-ticket-form">
      <h3>New ticket</h3>
      <div class="sub">Give it a short, searchable title. Status and priority can change later.</div>
      <div class="field">
        <span class="lbl">Title</span>
        <input type="text" id="new-title" autocomplete="off" />
        <div class="hint" id="title-hint">3–255 characters</div>
      </div>
      <div class="two">
        <div class="field">
          <span class="lbl">Status</span>
          <select id="new-status"></select>
        </div>
        <div class="field">
          <span class="lbl">Priority</span>
          <select id="new-priority"></select>
        </div>
      </div>
      <div class="actions">
        <button type="button" class="ghost" id="cancel-new">Cancel</button>
        <button type="submit" class="primary" id="create-btn">Create</button>
      </div>
    </form>
  </dialog>

  <dialog id="confirm-dialog">
    <div class="content">
      <h3 id="confirm-title">Archive this ticket?</h3>
      <div class="sub" id="confirm-body"></div>
      <div class="actions">
        <button type="button" class="ghost" id="confirm-cancel">Cancel</button>
        <button type="button" class="danger" id="confirm-ok">Archive</button>
      </div>
    </div>
  </dialog>

  <div class="toast-layer"><div class="toast" id="toast"></div></div>

  <script>
    // Vocabulary comes from /meta so the UI can't drift from the DB enums.
    let STATUSES = [];
    let PRIORITIES = [];

    const filter = { status: null, priority: null, archived: false, q: "" };
    let selectedTicketId = null;
    let confirmAction = null;

    const $list = document.getElementById("ticket-list");
    const $detail = document.getElementById("detail-pane");
    const $stats = document.getElementById("stats");
    const $toast = document.getElementById("toast");
    const $newDialog = document.getElementById("new-ticket-dialog");
    const $confirmDialog = document.getElementById("confirm-dialog");

    /* ── helpers ──────────────────────────────────────────────────── */

    const escapeHtml = s => String(s).replace(/[&<>"']/g, c =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const fmtDate = iso => new Date(iso).toLocaleString(undefined,
      { dateStyle: "medium", timeStyle: "short" });
    const label = s => s.replace(/_/g, " ");
    // Priority-only now that statuses render in full via label().
    const short = s => ({ medium: "med" }[s] || s);

    function debounce(fn, ms) {
      let t;
      return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
    }

    const TOASTC = {
      open: "var(--open)", in_progress: "var(--in_progress)", resolved: "var(--resolved)",
      low: "var(--low)", medium: "var(--medium)", high: "var(--high)", urgent: "var(--urgent)",
      info: "var(--blue)", error: "var(--red)",
    };
    let toastTimer = null;

    function toast(msg, kind = "error") {
      clearTimeout(toastTimer);
      // Reset, then force a reflow so the entrance animation re-triggers
      // even when a previous toast is still on screen.
      $toast.className = "toast";
      $toast.style.setProperty("--toastc", TOASTC[kind] || TOASTC.error);
      // One span per character, each with its own drift vector. On exit the
      // steps() timing makes them jump away in discrete frames.
      $toast.innerHTML = [...msg].map((ch, i) => {
        const d = (i * 14 + Math.random() * 70).toFixed(0);
        const dx = (Math.random() * 90 - 45).toFixed(0);
        const dy = (-40 - Math.random() * 60).toFixed(0);
        const r = (Math.random() * 70 - 35).toFixed(0);
        return `<span class="char" style="--d:${d}ms;--dx:${dx}px;--dy:${dy}px;--r:${r}deg">${escapeHtml(ch)}</span>`;
      }).join("");
      void $toast.offsetWidth;
      $toast.classList.add("enter");
      toastTimer = setTimeout(() => $toast.classList.add("leave"), 1400);
    }

    async function api(path, options = {}) {
      const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...options });
      if (res.status === 204) return null;
      const data = await res.json().catch(() => ({ error: res.statusText }));
      if (!res.ok) {
        const err = new Error(data.error || `HTTP ${res.status}`);
        err.field = data.field; err.status = res.status;
        throw err;
      }
      return data;
    }

    /* ── stats ────────────────────────────────────────────────────── */

    async function loadStats() {
      try {
        const s = await api("/stats");
        // Statuses spelled out to match the filter chips and the row badges —
        // one name per status everywhere, so nothing has to be decoded.
        const cells = [["total","total"],["open","open"],["in_progress","in progress"],
                       ["resolved","resolved"],["urgent","urgent"],["messages","msgs"],["archived","archived"]];
        $stats.innerHTML = cells
          .filter(([k]) => s[k] !== undefined && !(k === "archived" && !s[k]))
          .map(([k, l]) => `<div class="stat s-${k}"><span class="n">${s[k]}</span><span class="l">${l}</span></div>`)
          .join("");
      } catch {
        $stats.innerHTML = ""; // stats are decorative — never block the app on them
      }
    }

    /* ── filters ──────────────────────────────────────────────────── */

    function renderFilters() {
      const $s = document.getElementById("status-filters");
      const $p = document.getElementById("priority-filters");

      // Status uses the full name — there are only three, and "prog"/"done"
      // read as different words from the values the API actually accepts.
      $s.innerHTML =
        `<button class="chip ${!filter.status ? "on dark" : ""}" data-k="status" data-v="">All</button>` +
        STATUSES.map(v => `<button class="chip ${filter.status === v ? "on" : ""}" data-k="status" data-v="${v}" style="--chipc: var(--${v})">${label(v)}</button>`).join("");

      $p.innerHTML =
        `<button class="chip ${!filter.priority ? "on dark" : ""}" data-k="priority" data-v="">Any</button>` +
        PRIORITIES.map(v => `<button class="chip ${filter.priority === v ? "on" : ""}" data-k="priority" data-v="${v}" style="--chipc: var(--${v})">${short(v)}</button>`).join("");

      document.querySelectorAll(".chip").forEach(el => el.addEventListener("click", () => {
        const { k, v } = el.dataset;
        if (k === "status") filter.status = v || null;
        else filter.priority = v || null;
        renderFilters();
        loadTickets();
      }));

      // Status and archive are independent, so the toggle only reflects its own
      // state — switching it no longer clears the status or priority filter.
      const $a = document.getElementById("archive-toggle");
      $a.setAttribute("aria-pressed", String(filter.archived));

      document.getElementById("list-heading").textContent =
        filter.archived ? "Archived Tickets" : "All Tickets";
    }

    /* ── list ─────────────────────────────────────────────────────── */

    function listQuery() {
      const p = new URLSearchParams();
      if (filter.status) p.set("status", filter.status);
      if (filter.priority) p.set("priority", filter.priority);
      if (filter.archived) p.set("archived", "true");
      if (filter.q) p.set("q", filter.q);
      const qs = p.toString();
      return qs ? `/tickets?${qs}` : "/tickets";
    }

    // Lakebase round-trips run ~2s from here, so two filter clicks in quick
    // succession leave two requests in flight and they can resolve out of
    // order. Only the newest request is allowed to paint.
    let loadSeq = 0;

    async function loadTickets() {
      const seq = ++loadSeq;
      try {
        const rows = await api(listQuery());
        if (seq === loadSeq) renderList(rows);
      } catch (e) {
        if (seq === loadSeq) $list.innerHTML = `<div class="empty"><span class="big">⚠</span><span class="msg">${escapeHtml(e.message)}</span></div>`;
      }
    }

    function renderList(tickets) {
      document.getElementById("list-count").textContent =
        tickets.length + (tickets.length === 1 ? " ticket" : " tickets");
      if (!tickets.length) {
        const why = (filter.q || filter.status || filter.priority || filter.archived)
          ? "Nothing matches these filters" : "No tickets yet";
        $list.innerHTML = `<div class="empty"><span class="big">🔍</span><span class="msg">${why}</span></div>`;
        return;
      }
      $list.innerHTML = tickets.map(t => `
        <div class="ticket-item ${t.ticket_id === selectedTicketId ? "selected" : ""} ${t.deleted_at ? "archived" : ""}"
             data-id="${escapeHtml(t.ticket_id)}">
          <div class="title">${escapeHtml(t.title)}</div>
          <div class="meta">
            <span class="block ${t.status}">${label(t.status)}</span>
            <span class="block ${t.priority}">${t.priority}</span>
            <span class="when">${fmtDate(t.created_at)}</span>
          </div>
        </div>`).join("");
      $list.querySelectorAll(".ticket-item").forEach(el =>
        el.addEventListener("click", () => selectTicket(el.dataset.id)));
    }

    /* ── detail ───────────────────────────────────────────────────── */

    async function selectTicket(id) {
      selectedTicketId = id;
      $list.querySelectorAll(".ticket-item").forEach(el => el.classList.toggle("selected", el.dataset.id === id));
      $detail.innerHTML = `<div class="empty"><span class="msg">Loading…</span></div>`;
      try {
        const { ticket, messages } = await api(`/tickets/${encodeURIComponent(id)}`);
        renderDetail(ticket, messages);
      } catch (e) {
        $detail.innerHTML = `<div class="empty"><span class="big">⚠</span><span class="msg">${escapeHtml(e.message)}</span></div>`;
      }
    }

    const options = (vals, cur) => vals.map(v =>
      `<option value="${v}" ${v === cur ? "selected" : ""}>${label(v)}</option>`).join("");

    function renderDetail(ticket, messages) {
      const archived = Boolean(ticket.deleted_at);
      const n = messages.length;

      $detail.innerHTML = `
        <div class="detail-head">
          <div class="top">
            <h2>${escapeHtml(ticket.title)}</h2>
            ${archived ? `<button class="ghost" id="restore-btn">Restore</button>`
                       : `<button class="danger" id="delete-btn">Archive</button>`}
          </div>
          <div class="detail-meta">
            <span>Opened by <strong>${escapeHtml(ticket.created_by)}</strong></span>
            <span>${fmtDate(ticket.created_at)}</span>
            <span>${n} message${n === 1 ? "" : "s"}</span>
          </div>
          ${archived ? `<div class="archived-banner">📦 Archived ${fmtDate(ticket.deleted_at)} — read-only until restored.</div>` : `
          <div class="controls">
            <div class="ctl">
              <span class="lbl">Status</span>
              <select class="hard" id="status-select">${options(STATUSES, ticket.status)}</select>
            </div>
            <div class="ctl">
              <span class="lbl">Priority</span>
              <div class="seg" id="priority-seg">
                ${PRIORITIES.map(v => `<button data-v="${v}" class="${v === ticket.priority ? "on" : ""}" style="--segc: var(--${v})">${short(v)}</button>`).join("")}
              </div>
            </div>
          </div>`}
        </div>

        <div class="messages">
          ${n === 0 ? `<div class="empty"><span class="big">💬</span><span class="msg">No messages yet</span></div>`
            : messages.map(m => `
              <div class="message">
                <div class="head">
                  <span class="author">${escapeHtml(m.author)}</span>
                  <span>${fmtDate(m.created_at)}</span>
                </div>
                <div class="body">${escapeHtml(m.message_text)}</div>
              </div>`).join("")}
        </div>

        ${archived ? "" : `
        <form class="compose" id="compose-form">
          <textarea id="new-message" placeholder="Write a reply…" maxlength="5000"></textarea>
          <button type="submit" class="primary">Send</button>
        </form>`}
      `;

      if (archived) {
        document.getElementById("restore-btn").addEventListener("click", () => askConfirm({
          title: "Restore this ticket?",
          body: `“${ticket.title}” will return to the active list.`,
          ok: "Restore", danger: false,
          run: async () => {
            await api(`/tickets/${encodeURIComponent(ticket.ticket_id)}/restore`, { method: "POST" });
            toast("Ticket restored", "info");
            await refreshAll();
            selectTicket(ticket.ticket_id);
          },
        }));
        return;
      }

      document.getElementById("delete-btn").addEventListener("click", () => askConfirm({
        title: "Archive this ticket?",
        body: `“${ticket.title}” and its ${n} message${n === 1 ? "" : "s"} will be hidden from the active list. ` +
              `Nothing is permanently deleted — you can restore it from the Archived filter.`,
        ok: "Archive", danger: true,
        run: async () => {
          await api(`/tickets/${encodeURIComponent(ticket.ticket_id)}`, { method: "DELETE" });
          toast("Ticket archived", "info");
          selectedTicketId = null;
          $detail.innerHTML = `<div class="empty"><span class="big">📦</span><span class="msg">Ticket archived</span></div>`;
          refreshAll();
        },
      }));

      // Status stays a dropdown; priority is a segmented control that assigns.
      document.getElementById("status-select").addEventListener("change", async e => {
        await patchField(ticket, "status", e.target.value, () => { e.target.value = ticket.status; });
      });

      document.querySelectorAll("#priority-seg button").forEach(btn =>
        btn.addEventListener("click", async () => {
          const v = btn.dataset.v;
          if (v === ticket.priority) return;
          const prev = ticket.priority;
          document.querySelectorAll("#priority-seg button").forEach(b => b.classList.toggle("on", b === btn));
          await patchField(ticket, "priority", v, () => {
            document.querySelectorAll("#priority-seg button")
              .forEach(b => b.classList.toggle("on", b.dataset.v === prev));
          });
        }));

      document.getElementById("compose-form").addEventListener("submit", async e => {
        e.preventDefault();
        const $ta = document.getElementById("new-message");
        const text = $ta.value.trim();
        if (!text) { toast("Message cannot be blank", "error"); return; }
        try {
          await api(`/tickets/${encodeURIComponent(ticket.ticket_id)}/messages`, {
            method: "POST", body: JSON.stringify({ message_text: text }),
          });
          $ta.value = "";
          await selectTicket(ticket.ticket_id);
          loadStats();
        } catch (err) { toast(err.message, "error"); }
      });
    }

    async function patchField(ticket, field, value, revert) {
      try {
        await api(`/tickets/${encodeURIComponent(ticket.ticket_id)}/${field}`, {
          method: "PATCH", body: JSON.stringify({ [field]: value }),
        });
        toast(`${field} → ${label(value)}`, value);
        ticket[field] = value;
        refreshAll();
      } catch (err) {
        toast(err.message, "error");
        revert();
      }
    }

    /* ── confirm dialog ───────────────────────────────────────────── */

    function askConfirm({ title, body, ok, danger, run }) {
      document.getElementById("confirm-title").textContent = title;
      document.getElementById("confirm-body").textContent = body;
      const $ok = document.getElementById("confirm-ok");
      $ok.textContent = ok;
      $ok.className = danger ? "danger" : "primary";
      confirmAction = run;
      $confirmDialog.showModal();
    }

    document.getElementById("confirm-cancel").addEventListener("click", () => $confirmDialog.close());
    document.getElementById("confirm-ok").addEventListener("click", async () => {
      const run = confirmAction;
      $confirmDialog.close();
      confirmAction = null;
      if (!run) return;
      try { await run(); } catch (err) { toast(err.message, "error"); }
    });

    /* ── create ───────────────────────────────────────────────────── */

    const $title = document.getElementById("new-title");
    const $hint = document.getElementById("title-hint");

    function validateTitle(show) {
      const v = $title.value.trim();
      let msg = "";
      if (v.length === 0) msg = show ? "Title is required" : "";
      else if (v.length < 3) msg = `${3 - v.length} more character${3 - v.length === 1 ? "" : "s"} needed`;
      else if (v.length > 255) msg = `Too long by ${v.length - 255}`;
      $hint.textContent = msg || `${v.length}/255 characters`;
      $hint.classList.toggle("err", Boolean(msg));
      $title.classList.toggle("bad", Boolean(msg));
      return !msg && v.length >= 3;
    }
    $title.addEventListener("input", () => validateTitle(false));

    document.getElementById("new-ticket-btn").addEventListener("click", () => {
      $title.value = "";
      $hint.textContent = "3–255 characters";
      $hint.classList.remove("err");
      $title.classList.remove("bad");
      $newDialog.showModal();
      $title.focus();
    });
    document.getElementById("cancel-new").addEventListener("click", () => $newDialog.close());

    document.getElementById("new-ticket-form").addEventListener("submit", async e => {
      e.preventDefault();
      if (!validateTitle(true)) return;
      const $btn = document.getElementById("create-btn");
      $btn.disabled = true;
      try {
        const created = await api("/tickets", {
          method: "POST",
          body: JSON.stringify({
            title: $title.value.trim(),
            status: document.getElementById("new-status").value,
            priority: document.getElementById("new-priority").value,
          }),
        });
        $newDialog.close();
        toast("Ticket created", "info");
        await refreshAll();
        selectTicket(created.ticket_id);
      } catch (err) {
        // Server-side validation wins — mirror its message onto the field.
        if (err.field === "title") {
          $hint.textContent = err.message;
          $hint.classList.add("err");
          $title.classList.add("bad");
        } else { toast(err.message, "error"); }
      } finally { $btn.disabled = false; }
    });

    document.getElementById("search").addEventListener("input", debounce(e => {
      filter.q = e.target.value.trim();
      loadTickets();
    }, 250));

    // Bound once: unlike the chips, this button is static markup that
    // renderFilters() only re-reads the state of, never re-creates.
    document.getElementById("archive-toggle").addEventListener("click", () => {
      filter.archived = !filter.archived;
      renderFilters();
      loadTickets();
    });

    /* ── boot ─────────────────────────────────────────────────────── */

    const refreshAll = () => Promise.all([loadTickets(), loadStats()]);

    (async function init() {
      try {
        const meta = await api("/meta");
        STATUSES = meta.statuses; PRIORITIES = meta.priorities;
      } catch {
        STATUSES = ["open", "in_progress", "resolved"];
        PRIORITIES = ["low", "medium", "high", "urgent"];
      }
      document.getElementById("new-status").innerHTML = options(STATUSES, "open");
      document.getElementById("new-priority").innerHTML = options(PRIORITIES, "medium");
      renderFilters();
      refreshAll();
    })();
  </script>
</body>
</html>
