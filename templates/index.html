<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Support Tickets</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #171d24;
      --panel-2: #1f2731;
      --border: #2a3440;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #4493f8;
      --accent-hover: #58a6ff;
      --open: #f0883e;
      --in_progress: #d29922;
      --resolved: #3fb950;
      --danger: #f85149;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f6f8fa;
        --panel: #ffffff;
        --panel-2: #f0f3f6;
        --border: #d0d7de;
        --text: #1f2328;
        --muted: #656d76;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
    }
    header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { margin: 0; font-size: 18px; font-weight: 600; }
    header .user { color: var(--muted); font-size: 13px; }
    main {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 0;
      height: calc(100vh - 57px);
    }
    .list-pane {
      border-right: 1px solid var(--border);
      background: var(--panel);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .list-pane .toolbar {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .list-pane .toolbar h2 { margin: 0; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); }
    .ticket-list { overflow-y: auto; flex: 1; }
    .ticket-item {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.1s;
    }
    .ticket-item:hover { background: var(--panel-2); }
    .ticket-item.selected { background: var(--panel-2); border-left: 3px solid var(--accent); padding-left: 13px; }
    .ticket-item .title { font-weight: 500; margin-bottom: 4px; }
    .ticket-item .meta { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .badge.open { background: rgba(240, 136, 62, 0.15); color: var(--open); }
    .badge.in_progress { background: rgba(210, 153, 34, 0.15); color: var(--in_progress); }
    .badge.resolved { background: rgba(63, 185, 80, 0.15); color: var(--resolved); }
    .detail-pane {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .detail-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    .detail-header h2 { margin: 0 0 8px 0; font-size: 20px; }
    .detail-header .meta { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 12px; }
    .status-select {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    .messages { flex: 1; overflow-y: auto; padding: 20px 24px; }
    .message {
      padding: 12px 16px;
      background: var(--panel-2);
      border-radius: 8px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
    }
    .message .header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 12px;
      color: var(--muted);
    }
    .message .author { font-weight: 600; color: var(--text); }
    .message .body { white-space: pre-wrap; }
    .compose {
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      background: var(--panel);
      display: flex;
      gap: 8px;
    }
    .compose textarea {
      flex: 1;
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      font-family: inherit;
      font-size: 14px;
      resize: vertical;
      min-height: 60px;
    }
    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.1s;
    }
    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.secondary { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }
    .empty {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--muted);
      font-size: 14px;
    }
    dialog {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0;
      width: 90%;
      max-width: 480px;
    }
    dialog::backdrop { background: rgba(0, 0, 0, 0.5); }
    dialog form { padding: 24px; }
    dialog h3 { margin: 0 0 16px 0; }
    dialog label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.3px; }
    dialog input, dialog select, dialog textarea {
      width: 100%;
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      font-family: inherit;
      font-size: 14px;
      margin-bottom: 16px;
    }
    dialog textarea { min-height: 80px; resize: vertical; }
    dialog .actions { display: flex; justify-content: flex-end; gap: 8px; }
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--danger);
      color: white;
      padding: 12px 16px;
      border-radius: 8px;
      max-width: 360px;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <header>
    <h1>🎫 Support Tickets</h1>
    <span class="user" id="user-email"></span>
  </header>

  <main>
    <section class="list-pane">
      <div class="toolbar">
        <h2>All Tickets</h2>
        <button id="new-ticket-btn">+ New</button>
      </div>
      <div class="ticket-list" id="ticket-list">
        <div class="empty">Loading…</div>
      </div>
    </section>

    <section class="detail-pane" id="detail-pane">
      <div class="empty">Select a ticket to view its thread</div>
    </section>
  </main>

  <dialog id="new-ticket-dialog">
    <form id="new-ticket-form" method="dialog">
      <h3>Create ticket</h3>
      <label for="new-title">Title</label>
      <input type="text" id="new-title" required maxlength="200" />
      <label for="new-status">Initial status</label>
      <select id="new-status">
        <option value="open">Open</option>
        <option value="in_progress">In progress</option>
        <option value="resolved">Resolved</option>
      </select>
      <div class="actions">
        <button type="button" class="secondary" id="cancel-new">Cancel</button>
        <button type="submit">Create</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast"></div>

  <script>
    const STATUSES = ["open", "in_progress", "resolved"];
    let selectedTicketId = null;

    const $list = document.getElementById("ticket-list");
    const $detail = document.getElementById("detail-pane");
    const $toast = document.getElementById("toast");
    const $dialog = document.getElementById("new-ticket-dialog");

    function toast(msg) {
      $toast.textContent = msg;
      $toast.classList.add("show");
      setTimeout(() => $toast.classList.remove("show"), 3000);
    }

    async function api(path, options = {}) {
      const res = await fetch(path, {
        headers: { "Content-Type": "application/json" },
        ...options,
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({ error: res.statusText }));
        throw new Error(err.error || `HTTP ${res.status}`);
      }
      return res.json();
    }

    function fmtDate(iso) {
      const d = new Date(iso);
      return d.toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    async function loadTickets() {
      try {
        const tickets = await api("/tickets");
        renderList(tickets);
      } catch (e) {
        $list.innerHTML = `<div class="empty">Failed to load: ${escapeHtml(e.message)}</div>`;
      }
    }

    function renderList(tickets) {
      if (!tickets.length) {
        $list.innerHTML = `<div class="empty">No tickets yet</div>`;
        return;
      }
      $list.innerHTML = tickets.map(t => `
        <div class="ticket-item ${t.ticket_id == selectedTicketId ? "selected" : ""}" data-id="${escapeHtml(t.ticket_id)}">
          <div class="title">${escapeHtml(t.title)}</div>
          <div class="meta">
            <span class="badge ${t.status}">${t.status.replace("_", " ")}</span>
            <span>${fmtDate(t.created_at)}</span>
          </div>
        </div>
      `).join("");
      $list.querySelectorAll(".ticket-item").forEach(el => {
        el.addEventListener("click", () => selectTicket(el.dataset.id));
      });
    }

    async function selectTicket(id) {
      selectedTicketId = id;
      $list.querySelectorAll(".ticket-item").forEach(el => {
        el.classList.toggle("selected", el.dataset.id == id);
      });
      $detail.innerHTML = `<div class="empty">Loading…</div>`;
      try {
        const { ticket, messages } = await api(`/tickets/${encodeURIComponent(id)}`);
        renderDetail(ticket, messages);
      } catch (e) {
        $detail.innerHTML = `<div class="empty">Failed to load: ${escapeHtml(e.message)}</div>`;
      }
    }

    function renderDetail(ticket, messages) {
      const statusOptions = STATUSES.map(s =>
        `<option value="${s}" ${s === ticket.status ? "selected" : ""}>${s.replace("_", " ")}</option>`
      ).join("");

      $detail.innerHTML = `
        <div class="detail-header">
          <h2>${escapeHtml(ticket.title)}</h2>
          <div class="meta">
            <span>Opened by <strong>${escapeHtml(ticket.created_by)}</strong> · ${fmtDate(ticket.created_at)}</span>
            <select class="status-select" id="status-select">${statusOptions}</select>
          </div>
        </div>
        <div class="messages" id="messages">
          ${messages.length === 0 ? `<div class="empty">No messages yet</div>` : messages.map(m => `
            <div class="message">
              <div class="header">
                <span class="author">${escapeHtml(m.author)}</span>
                <span>${fmtDate(m.created_at)}</span>
              </div>
              <div class="body">${escapeHtml(m.message_text)}</div>
            </div>
          `).join("")}
        </div>
        <form class="compose" id="compose-form">
          <textarea id="new-message" placeholder="Write a reply…" required></textarea>
          <button type="submit">Send</button>
        </form>
      `;

      document.getElementById("status-select").addEventListener("change", async (e) => {
        const newStatus = e.target.value;
        try {
          await api(`/tickets/${encodeURIComponent(ticket.ticket_id)}/status`, {
            method: "PATCH",
            body: JSON.stringify({ status: newStatus }),
          });
          toast(`Status set to "${newStatus.replace("_", " ")}"`);
          loadTickets();
        } catch (err) {
          toast(`Failed: ${err.message}`);
          e.target.value = ticket.status;
        }
      });

      document.getElementById("compose-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const $ta = document.getElementById("new-message");
        const text = $ta.value.trim();
        if (!text) return;
        try {
          await api(`/tickets/${encodeURIComponent(ticket.ticket_id)}/messages`, {
            method: "POST",
            body: JSON.stringify({ message_text: text }),
          });
          $ta.value = "";
          selectTicket(ticket.ticket_id);
        } catch (err) {
          toast(`Failed: ${err.message}`);
        }
      });
    }

    document.getElementById("new-ticket-btn").addEventListener("click", () => $dialog.showModal());
    document.getElementById("cancel-new").addEventListener("click", () => $dialog.close());
    document.getElementById("new-ticket-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const title = document.getElementById("new-title").value.trim();
      const status = document.getElementById("new-status").value;
      if (!title) return;
      try {
        const created = await api("/tickets", {
          method: "POST",
          body: JSON.stringify({ title, status }),
        });
        $dialog.close();
        document.getElementById("new-title").value = "";
        await loadTickets();
        selectTicket(created.ticket_id);
      } catch (err) {
        toast(`Failed: ${err.message}`);
      }
    });

    loadTickets();
  </script>
</body>
</html>
